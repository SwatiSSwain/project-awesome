name: Test Project Awesome Render

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("rmarkdown", "knitr", "leaflet", "htmlwidgets", "dplyr", "tidyr", "purrr", "readr", "stringr", "lubridate", "jsonlite", "sf", "geosphere"))'

      - name: Render Project Awesome
        run: |
          Rscript -e 'rmarkdown::render("project_awesome_v16_with_story_timeline.Rmd", output_file = "index.html")'

      - name: Verify output
        run: |
          test -f index.html
          ls -lh index.html

      - name: Upload rendered HTML
        uses: actions/upload-artifact@v4
        with:
          name: project-awesome-html
          path: index.html
