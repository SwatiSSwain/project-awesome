name: Deploy Project Awesome

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "project_awesome_v16_with_story_timeline.Rmd"
      - "minnesota_destinations_coordinates.csv"
      - ".github/workflows/deploy.yml"

  schedule:
    # GitHub cron uses UTC.
    # Runs every day at 11:00 UTC.
    - cron: "0 11 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("rmarkdown", "knitr", "leaflet", "htmlwidgets", "dplyr", "tidyr", "purrr", "readr", "stringr", "lubridate", "jsonlite", "sf", "geosphere", "maps"))'

      - name: Render Project Awesome
        run: |
          mkdir -p _site
          Rscript -e 'rmarkdown::render(
            "project_awesome_v16_with_story_timeline.Rmd",
            output_file = "index.html",
            output_dir = "_site"
          )'

      - name: Verify rendered site
        run: |
          test -f _site/index.html
          echo "Project Awesome rendered successfully:"
          ls -lh _site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
